name: Publish Package and Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # This is important for getting all tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: node -e 'const v = require("./package.json").version; if (process.env.GITHUB_REF_NAME !== `v${v}`) { console.error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${v}`); process.exit(1); }'

      - name: Test
        run: npm test

      - name: Check public types
        run: npm run test:types

      - name: Build
        run: npm run build

      - name: Verify package entry points
        run: |
          npm run test:package
          npx --yes --package=node@16 node scripts/smoke-package.cjs
          npx --yes --package=node@16 node --conditions=development scripts/smoke-package.cjs

      - name: Find built files
        id: find_files
        run: |
          CJS_FILE=dist/cjs/production/index.js
          ESM_FILE=dist/esm/production/index.js
          TYPES_FILE=dist/types/index.d.ts
          test -f "$CJS_FILE" && test -f "$ESM_FILE" && test -f "$TYPES_FILE"
          
          echo "CJS file: $CJS_FILE"
          echo "ESM file: $ESM_FILE"
          echo "Types file: $TYPES_FILE"
          
          echo "cjs_file=$CJS_FILE" >> $GITHUB_OUTPUT
          echo "esm_file=$ESM_FILE" >> $GITHUB_OUTPUT
          echo "types_file=$TYPES_FILE" >> $GITHUB_OUTPUT

      - name: Get Changelog Entry
        id: get_changelog
        run: node scripts/release-notes.cjs "$GITHUB_REF_NAME"

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: ${{ steps.get_changelog.outputs.changelog }}
          draft: false
          prerelease: false

      - name: Upload CJS Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_files.outputs.cjs_file }}
          asset_name: index.cjs.js
          asset_content_type: application/javascript

      - name: Upload ESM Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_files.outputs.esm_file }}
          asset_name: index.esm.js
          asset_content_type: application/javascript

      - name: Upload Types Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_files.outputs.types_file }}
          asset_name: index.d.ts
          asset_content_type: application/typescript
